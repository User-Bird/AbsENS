<div class="table-card">
  <table class="data-table">
    <thead>
    <tr>
      <th>CNE</th>
      <th>Nom complet</th>
      <th>Email</th>
      <th>Groupe</th>
      <th>Actions</th> </tr>
    </thead>
    <tbody>
      @for (etudiant of filteredEtudiants(); track etudiant.id) {
        <tr>
          <td><span class="badge badge-gray">{{ etudiant.cne }}</span></td>
          <td><strong>{{ etudiant.nom | uppercase }}</strong> {{ etudiant.prenom }}</td>
          <td>{{ etudiant.email }}</td>
          <td><span class="badge badge-blue">{{ etudiant.groupe }}</span></td>

          <td>
            <a [routerLink]="['/rapports/etudiant', etudiant.id]" class="btn btn-sm btn-primary">Voir Rapport</a>
          </td>

        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center">Aucun étudiant ne correspond à ces critères.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
